aid: goodreads
name: Goodreads
description: >-
  Goodreads is the world's largest site for readers and book recommendations,
  where members catalog and shelve books, rate and review them, track their
  reading progress, join reader groups, and receive personalized
  recommendations. Owned by Amazon since 2013, it originated as a portfolio
  company of True Ventures. Goodreads formerly operated a public developer API
  (XML over HTTP, authenticated with a developer key and OAuth 1.0a) that
  powered many third-party reading apps, but on 2020-12-08 it stopped issuing
  new developer keys and began retiring the program; there is no current public
  API. Goodreads still exposes a live OpenID Connect discovery document for
  account sign-in. This profile is enriched by the API Evangelist pipeline.
